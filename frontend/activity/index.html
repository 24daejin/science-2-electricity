<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교과서 활동 · 전기와 자기 학습 플랫폼</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
</head>
<body>
<div class="page">
  <a href="../index.html" class="btn secondary" id="home-link" style="margin-bottom:14px; text-decoration:none; display:inline-flex;">← 홈으로</a>
  <div class="brand">
    <div class="badge"></div>
    <div>
      <h1 id="title-text">교과서 활동</h1>
    </div>
  </div>

  <div id="loading-view" class="card">불러오는 중...</div>
  <div id="error-view" class="card error" style="display:none;"></div>

  <div id="activity-view" class="card" style="display:none;">
    <div id="image-wrap" style="position:relative; width:100%; line-height:0;">
      <img id="activity-image" style="width:100%; display:block; border-radius:var(--radius-sm); box-shadow:var(--shadow);" alt="" />
    </div>
    <div id="hints-section" style="margin-top:14px;"></div>
    <div id="teacher-panel" style="margin-top:14px; display:none;"></div>
    <div id="save-row" style="margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="save-btn">답변 저장</button>
      <span class="muted" id="save-status"></span>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/visibility.js"></script>
<script>
  const user = requireLogin();
  const params = new URLSearchParams(window.location.search);
  const activityId = params.get('id');

  // 메인 화면의 팝업(iframe) 안에서 열렸을 때는 "← 홈으로"를 누르면 그 좁은 팝업 안에서
  // 홈 화면으로 이동해버려 혼란스러우니, 이 버튼 자체를 숨깁니다(팝업엔 이미 닫기(×) 버튼이 있음).
  if (window.self !== window.top) {
    const homeLink = document.getElementById('home-link');
    if (homeLink) homeLink.style.display = 'none';
  }

  // 활동마다 이미지 + 빈칸(문항) 위치를 여기 등록합니다. left/top/width/height는 이미지 크기에
  // 대한 비율(%)이라, 화면 크기가 달라져도 항상 원본의 같은 자리를 가리킵니다.
  // 위치는 원본 이미지를 보고 눈대중으로 맞춘 값입니다 — 실제 화면에서 살짝 어긋나 보이면
  // 알려주세요, 숫자만 조정하면 바로 고칠 수 있습니다.
  const ACTIVITIES = {
    '01_1': {
      title: '마찰 전기의 성질 알아보기',
      image: '../assets/textbook/01_1_마찰 전기의 성질 알아보기.png',
      questions: [
        { id: 'q1', left: '4%', top: '89%', width: '92%', height: '10%' },
      ],
    },
    '01_2': {
      title: '정전기 유도',
      image: '../assets/textbook/01_2_정전기 유도.png',
      questions: [
        { id: 'q1', left: '2%', top: '15%', width: '21%', height: '13%' },
      ],
    },
    '01_3': {
      title: '검전기로 정전기 유도 현상 관찰하기',
      image: '../assets/textbook/01_3_검전기로 정전기 유도 현상 관찰하기.png',
      questions: [
        { id: 'q1', left: '4%', top: '89%', width: '92%', height: '10%' },
      ],
    },
  };

  const els = {
    loading: document.getElementById('loading-view'),
    error: document.getElementById('error-view'),
    view: document.getElementById('activity-view'),
    titleText: document.getElementById('title-text'),
    imageWrap: document.getElementById('image-wrap'),
    image: document.getElementById('activity-image'),
    teacherPanel: document.getElementById('teacher-panel'),
    saveRow: document.getElementById('save-row'),
    saveBtn: document.getElementById('save-btn'),
    saveStatus: document.getElementById('save-status'),
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showError(msg) {
    els.loading.style.display = 'none';
    els.view.style.display = 'none';
    els.error.style.display = 'block';
    els.error.textContent = msg;
  }

  async function init() {
    const activity = ACTIVITIES[activityId];
    if (!activity) {
      showError('존재하지 않는 활동입니다. 홈으로 돌아가 다시 선택해주세요.');
      return;
    }

    els.titleText.textContent = activity.title;
    els.image.src = activity.image;
    els.image.alt = activity.title;

    // 교사는 답을 쓰는 게 아니라 문항마다 모범답안(+문제)을 관리합니다 — 시트를 직접 열지
    // 않아도 웹앱에서 바로 입력할 수 있게 하는 화면입니다. 학생용 입력창/저장 버튼은 안 보여줍니다.
    if (user.role === 'teacher') {
      els.saveRow.style.display = 'none';
      els.loading.style.display = 'none';
      els.view.style.display = 'block';
      initTeacherPanel(activity);
      return;
    }

    activity.questions.forEach((q) => {
      const box = document.createElement('textarea');
      box.className = 'activity-answer-box';
      box.dataset.questionId = q.id;
      box.placeholder = '여기에 답을 적어보세요';
      box.style.left = q.left;
      box.style.top = q.top;
      box.style.width = q.width;
      box.style.height = q.height;
      els.imageWrap.appendChild(box);
    });

    let existingAnswers = {};
    try {
      existingAnswers = await callApi('getMyActivityResponses', { activityId });
    } catch (err) {
      console.warn('이전 답변을 불러오지 못했습니다:', err.message);
    }
    els.imageWrap.querySelectorAll('.activity-answer-box').forEach((box) => {
      const saved = existingAnswers[box.dataset.questionId];
      if (saved) box.value = saved;
    });

    els.loading.style.display = 'none';
    els.view.style.display = 'block';

    initDropoutTracking(`activity-${activityId}`);
    loadHints(activity); // 기다리지 않음 — 조금 늦게 나타나도 무방(첫 요청이면 AI 생성 시간이 걸릴 수 있음)
  }

  /**
   * 교사 전용: 문항마다 문제(선택)·모범답안을 입력·저장하는 패널. 저장하면 서버가 기존에
   * 생성돼있던 도움말을 비워서, 다음에 학생이 열 때 바뀐 모범답안으로 새로 생성되게 한다.
   */
  async function initTeacherPanel(activity) {
    let existing = {};
    try {
      existing = await callApi('getActivityModelAnswers', { activityId });
    } catch (err) {
      console.warn('모범답안을 불러오지 못했습니다:', err.message);
    }

    const panel = els.teacherPanel;
    panel.style.display = 'block';
    const fieldStyle = 'width:100%; margin-top:8px; padding:10px; border-radius:var(--radius-sm); border:1.5px solid var(--color-border); font-family:inherit; font-size:0.92rem;';
    panel.innerHTML = activity.questions
      .map((q, idx) => {
        const data = existing[q.id] || {};
        const statusText = data.hint ? '도움말 생성됨' : data.modelAnswer ? '도움말 대기 중(학생이 열면 생성돼요)' : '';
        return `
      <div class="status-banner" style="margin-bottom:10px; background:var(--color-surface); border:1px solid var(--color-border);">
        <strong style="color:var(--color-text);">빈칸 ${idx + 1} 모범답안</strong>
        <input type="text" data-question-field="${q.id}" placeholder="문항 내용(선택 — 있으면 힌트 품질이 좋아져요)" value="${escapeHtml(data.question || '')}" style="${fieldStyle}" />
        <textarea data-model-answer-field="${q.id}" placeholder="모범답안(비워두면 힌트 기능이 꺼져요)" rows="2" style="${fieldStyle}">${escapeHtml(data.modelAnswer || '')}</textarea>
        <div style="margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn secondary" data-save-model="${q.id}" style="font-size:0.82rem; padding:6px 14px;">저장</button>
          <span class="muted" data-model-status="${q.id}" style="font-size:0.82rem;">${escapeHtml(statusText)}</span>
        </div>
      </div>`;
      })
      .join('');

    panel.querySelectorAll('[data-save-model]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const qid = btn.dataset.saveModel;
        const questionText = panel.querySelector(`[data-question-field="${qid}"]`).value;
        const modelAnswer = panel.querySelector(`[data-model-answer-field="${qid}"]`).value;
        const statusEl = panel.querySelector(`[data-model-status="${qid}"]`);
        btn.disabled = true;
        statusEl.textContent = '저장하는 중...';
        try {
          await callApi('setActivityModelAnswer', { activityId, questionId: qid, question: questionText, modelAnswer });
          statusEl.textContent = modelAnswer.trim() ? '저장했어요 · 학생이 열면 새 도움말이 생성돼요' : '저장했어요(모범답안 없음 — 힌트 꺼짐)';
        } catch (err) {
          statusEl.textContent = '저장 실패: ' + err.message;
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  /**
   * 선생님이 "활동_모범답안" 시트에 모범답안을 적어둔 문항만 힌트 버튼을 보여준다. 모범답안이
   * 없는 문항은 서버 응답에 아예 안 들어있으므로 여기서도 자연스럽게 빠진다.
   */
  async function loadHints(activity) {
    let hints = {};
    try {
      hints = await callApi('getActivityHints', { activityId, title: activity.title });
    } catch (err) {
      console.warn('힌트를 불러오지 못했습니다:', err.message);
      return;
    }

    const entries = activity.questions
      .map((q, idx) => ({ id: q.id, label: `빈칸 ${idx + 1}`, hint: hints[q.id] }))
      .filter((e) => e.hint);
    if (!entries.length) return;

    const section = document.getElementById('hints-section');
    section.innerHTML = entries
      .map(
        (e) => `
      <div class="status-banner" style="margin-bottom:8px;">
        <button type="button" class="btn secondary" data-hint-toggle="${e.id}" style="font-size:0.82rem; padding:6px 12px;">💡 ${e.label} 힌트 보기</button>
        <p class="muted" data-hint-text="${e.id}" style="display:none; margin:8px 0 0;">${escapeHtml(e.hint)}</p>
      </div>`
      )
      .join('');

    section.querySelectorAll('[data-hint-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const entry = entries.find((e) => e.id === btn.dataset.hintToggle);
        const textEl = section.querySelector(`[data-hint-text="${entry.id}"]`);
        const isOpen = textEl.style.display !== 'none';
        textEl.style.display = isOpen ? 'none' : 'block';
        btn.textContent = `💡 ${entry.label} 힌트 ${isOpen ? '보기' : '닫기'}`;
      });
    });
  }

  async function save() {
    const boxes = [...els.imageWrap.querySelectorAll('.activity-answer-box')];
    els.saveBtn.disabled = true;
    els.saveStatus.textContent = '저장하는 중...';
    try {
      for (const box of boxes) {
        await callApi('submitActivityResponse', {
          activityId,
          questionId: box.dataset.questionId,
          answer: box.value,
        });
      }
      els.saveStatus.textContent = '저장했어요 · ' + new Date().toLocaleTimeString('ko-KR');
    } catch (err) {
      els.saveStatus.textContent = '저장에 실패했습니다: ' + err.message;
    } finally {
      els.saveBtn.disabled = false;
    }
  }

  els.saveBtn.addEventListener('click', save);

  if (user) init();
</script>
</body>
</html>
