<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>진단평가 · 전기와 자기 학습 플랫폼</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="page">
  <a href="../index.html" class="btn secondary" style="margin-bottom:14px; text-decoration:none; display:inline-flex;">← 홈으로</a>
  <div class="brand">
    <div class="badge"></div>
    <div>
      <h1>진단평가</h1>
      <p class="muted">단원을 시작하기 전, 선수학습을 확인해요.</p>
    </div>
  </div>

  <div id="loading-view" class="card">문항을 불러오는 중입니다...</div>

  <div id="quiz-view" class="card" style="display:none;">
    <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <p class="muted" id="progress-text"></p>
    <div class="status-banner" id="attempt-banner" style="display:none;"></div>

    <span class="tag" id="prior-area-tag"></span>
    <h2 id="question-text"></h2>

    <div class="choice-list" id="choice-list"></div>
  </div>

  <div id="done-view" class="card" style="display:none; text-align:center;">
    <img src="../assets/images/celebration.png" alt="" style="width:180px; max-width:60%; margin-bottom:8px;" />
    <h2>진단평가를 완료했어요!</h2>
    <p id="done-summary" class="muted"></p>
  </div>

  <div id="error-view" class="card error" style="display:none;"></div>
</div>

<div id="feedback-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" id="feedback-modal-box"></div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/confidence.js"></script>
<script src="../assets/js/firebase.js"></script>
<script>
  const user = requireLogin();

  let questions = [];
  let currentIndex = 0;
  let attemptCounts = {}; // questionId -> 지금까지의 시도 횟수(이번 세션 포함해서 갱신)
  const latestResultByQuestion = {}; // questionId -> 가장 최근 시도의 정답 여부(재도전 시 마지막 결과만 반영)
  let selectedChoice = null; // 1~4
  let selectedConfidence = null; // CONFIDENCE_TAGS 항목

  const els = {
    loading: document.getElementById('loading-view'),
    quiz: document.getElementById('quiz-view'),
    done: document.getElementById('done-view'),
    error: document.getElementById('error-view'),
    progressFill: document.getElementById('progress-fill'),
    progressText: document.getElementById('progress-text'),
    attemptBanner: document.getElementById('attempt-banner'),
    priorAreaTag: document.getElementById('prior-area-tag'),
    questionText: document.getElementById('question-text'),
    choiceList: document.getElementById('choice-list'),
    doneSummary: document.getElementById('done-summary'),
    modalOverlay: document.getElementById('feedback-modal'),
    modalBox: document.getElementById('feedback-modal-box'),
  };

  let followupEl = null; // 선택한 보기 바로 아래에 끼워넣는 확신도 블록

  function showError(message) {
    els.loading.style.display = 'none';
    els.quiz.style.display = 'none';
    els.error.style.display = 'block';
    els.error.textContent = message;
  }

  async function loadQuestions() {
    try {
      questions = await fetchDiagnosticQuestionsFS();
      if (!questions.length) throw new Error('등록된 진단평가 문항이 없습니다.');
      attemptCounts = await callApi('getDiagnosticAttemptCounts', {}).catch(() => ({}));
      els.loading.style.display = 'none';
      els.quiz.style.display = 'block';
      renderQuestion();
    } catch (err) {
      showError('문항을 불러오지 못했습니다: ' + err.message);
    }
  }

  function renderQuestion() {
    selectedChoice = null;
    selectedConfidence = null;

    const q = questions[currentIndex];
    els.progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;
    els.progressText.textContent = `${currentIndex + 1} / ${questions.length}`;
    els.priorAreaTag.textContent = q.priorArea || '';
    els.questionText.textContent = q.question;

    const priorAttempts = attemptCounts[q.questionId] || 0;
    if (priorAttempts > 0) {
      els.attemptBanner.style.display = 'block';
      els.attemptBanner.textContent = `지금은 ${priorAttempts + 1}번째 풀고 있어요.`;
    } else {
      els.attemptBanner.style.display = 'none';
    }

    els.choiceList.innerHTML = '';
    followupEl = null;
    q.choices.forEach((choiceText, idx) => {
      const num = idx + 1;
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.type = 'button';
      btn.dataset.choiceNum = String(num);
      btn.textContent = `${num}. ${choiceText}`;
      btn.addEventListener('click', () => onChoiceSelected(num, btn));
      els.choiceList.appendChild(btn);
    });
  }

  function choiceButtons() {
    return [...els.choiceList.querySelectorAll('button.choice')];
  }

  // 학생이 답을 선택하면 -> 그 보기 바로 아래에 확신도 태그를 먼저 보여준다 (정답 공개는 아직 하지 않음)
  function onChoiceSelected(num, btnEl) {
    selectedChoice = num;
    choiceButtons().forEach((c) => {
      c.classList.remove('selected', 'correct', 'incorrect');
      c.disabled = false;
    });
    btnEl.classList.add('selected');

    if (followupEl) followupEl.remove();
    followupEl = document.createElement('div');
    followupEl.className = 'followup-block';

    const heading = document.createElement('h2');
    heading.textContent = '이 답에 대해 얼마나 확신하나요?';
    heading.style.marginTop = '4px';
    followupEl.appendChild(heading);

    const confidenceList = document.createElement('div');
    confidenceList.className = 'choice-list';
    CONFIDENCE_TAGS.forEach((tag) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.type = 'button';
      btn.textContent = tag.label;
      btn.addEventListener('click', () => onConfidenceSelected(tag));
      confidenceList.appendChild(btn);
    });
    followupEl.appendChild(confidenceList);

    btnEl.insertAdjacentElement('afterend', followupEl);
    followupEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 확신도를 선택한 다음에야 정오답 공개 + 4종 피드백 중 하나를 팝업으로 보여준다.
  // 팝업의 "확인"을 누르면 다음 문항으로 자동으로 넘어간다.
  function onConfidenceSelected(tag) {
    selectedConfidence = tag;

    const q = questions[currentIndex];
    const isCorrect = selectedChoice === q.answer;
    latestResultByQuestion[q.questionId] = isCorrect;

    choiceButtons().forEach((c) => {
      const num = Number(c.dataset.choiceNum);
      c.disabled = true;
      if (num === q.answer) c.classList.add('correct');
      else if (num === selectedChoice) c.classList.add('incorrect');
    });
    if (followupEl) followupEl.remove();

    const feedbackKey = feedbackKeyFor(isCorrect, tag.bucket);
    showFeedbackModal(isCorrect, q.feedback[feedbackKey] || '', goToNextQuestion);

    callApi('submitDiagnosticResponse', {
      questionId: q.questionId,
      selectedChoice: selectedChoice,
      confidence: tag.label,
      isCorrect: isCorrect,
    })
      .then((result) => {
        attemptCounts[q.questionId] = result.attemptNumber;
      })
      .catch((err) => console.warn('응답 저장 실패:', err.message));
  }

  function showFeedbackModal(isCorrect, feedbackText, onConfirm) {
    els.modalBox.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');

    const icon = document.createElement('img');
    icon.src = isCorrect ? '../assets/images/correct-icon.png' : '../assets/images/incorrect-icon.png';
    icon.alt = '';
    icon.className = 'feedback-icon';
    box.appendChild(icon);

    const text = document.createElement('span');
    text.textContent = feedbackText;
    box.appendChild(text);

    els.modalBox.appendChild(box);

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn block';
    confirmBtn.style.marginTop = '16px';
    confirmBtn.textContent = '확인';
    confirmBtn.addEventListener('click', () => {
      els.modalOverlay.style.display = 'none';
      onConfirm();
    });
    els.modalBox.appendChild(confirmBtn);

    els.modalOverlay.style.display = 'flex';
  }

  function goToNextQuestion() {
    currentIndex += 1;
    if (currentIndex >= questions.length) {
      els.quiz.style.display = 'none';
      els.done.style.display = 'block';
      const correctCount = Object.values(latestResultByQuestion).filter(Boolean).length;
      els.doneSummary.textContent = `${questions.length}문항 중 ${correctCount}문항을 맞혔어요.`;
    } else {
      renderQuestion();
    }
  }

  if (user) loadQuestions();
</script>
</body>
</html>
