<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>형성평가 · 전기와 자기 학습 플랫폼</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="page">
  <a href="../index.html" class="btn secondary" style="margin-bottom:14px; text-decoration:none; display:inline-flex;">← 홈으로</a>
  <div class="brand">
    <div class="badge"></div>
    <div>
      <h1 id="title-text">형성평가</h1>
      <p class="muted">선생님이 진행하는 문항에 맞춰 화면이 자동으로 바뀝니다.</p>
    </div>
  </div>

  <div id="loading-view" class="card">문항을 불러오는 중입니다...</div>

  <div id="waiting-view" class="card" style="display:none;">
    <div class="status-banner">선생님이 문항을 시작하기를 기다리는 중이에요…</div>
  </div>

  <div id="quiz-view" class="card" style="display:none;">
    <p class="muted" id="progress-text"></p>
    <div class="status-banner" id="attempt-banner" style="display:none;"></div>
    <span class="tag" id="concept-tag"></span>
    <h2 id="question-text"></h2>

    <div class="choice-list" id="choice-list"></div>
    <p class="muted" id="single-mode-hint" style="display:none; margin-top:14px;">선생님이 다음 문항으로 넘기면 자동으로 이어집니다.</p>
  </div>

  <div id="ended-view" class="card" style="display:none;">
    <h2>이 소단원 형성평가가 종료되었어요.</h2>
  </div>

  <div id="error-view" class="card error" style="display:none;"></div>
</div>

<div id="feedback-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" id="feedback-modal-box"></div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/confidence.js"></script>
<script src="../assets/js/visibility.js"></script>
<script src="../assets/js/firebase.js"></script>
<script>
  const user = requireLogin();
  const params = new URLSearchParams(window.location.search);
  const subunitId = params.get('subunit');

  // 형성평가_문항 시트의 "소단원명" 값과 정확히 일치해야 합니다.
  const SUBUNIT_NAMES = {
    '1': '마찰전기와 정전기 유도',
    '2': '전류, 전압, 저항 사이의 관계',
    '3': '저항의 연결',
    '4': '전기 에너지의 전환과 소비 전력',
    '5': '전류에 의한 자기장',
    '6': '전기와 자기가 만드는 힘',
  };

  let questionsById = {};
  let questionsList = []; // 소단원 전체 문항(일괄 배포 모드에서 순서대로 사용)
  let attemptCounts = {}; // questionId -> 지금까지의 시도 횟수(이번 세션 포함해서 갱신)
  let currentQuestionId = null;
  let selectedChoice = null;
  let selectedConfidence = null;
  const latestResultByQuestion = {}; // questionId -> 가장 최근 시도의 정답 여부
  let stopPolling = null;

  // mode: null(대기) | 'single'(선생님이 문항 하나씩 진행) | 'batch'(소단원 전체를 학생이 자기 속도로 풀이)
  let mode = null;
  let batchIndex = 0;

  const els = {
    loading: document.getElementById('loading-view'),
    waiting: document.getElementById('waiting-view'),
    quiz: document.getElementById('quiz-view'),
    ended: document.getElementById('ended-view'),
    error: document.getElementById('error-view'),
    conceptTag: document.getElementById('concept-tag'),
    progressText: document.getElementById('progress-text'),
    attemptBanner: document.getElementById('attempt-banner'),
    questionText: document.getElementById('question-text'),
    choiceList: document.getElementById('choice-list'),
    singleModeHint: document.getElementById('single-mode-hint'),
    modalOverlay: document.getElementById('feedback-modal'),
    modalBox: document.getElementById('feedback-modal-box'),
  };

  function showView(name) {
    ['loading', 'waiting', 'quiz', 'ended', 'error'].forEach((v) => {
      els[v].style.display = v === name ? 'block' : 'none';
    });
  }

  async function init() {
    if (!subunitId || !SUBUNIT_NAMES[subunitId]) {
      showView('error');
      els.error.textContent = '잘못된 소단원 번호입니다. 홈으로 돌아가 다시 선택해주세요.';
      return;
    }
    document.getElementById('title-text').textContent = `형성평가 · ${subunitId}. ${SUBUNIT_NAMES[subunitId]}`;

    try {
      const questions = await fetchFormativeQuestionsFS(subunitId);
      questionsList = questions;
      questions.forEach((q) => { questionsById[q.questionId] = q; });
      attemptCounts = await callApi('getFormativeAttemptCounts', {}).catch(() => ({}));
    } catch (err) {
      showView('error');
      els.error.textContent = '문항을 불러오지 못했습니다: ' + err.message;
      return;
    }

    initDropoutTracking(`formative-subunit-${subunitId}`);

    // 2.5초 폴링 대신 Firestore 실시간 리스너로 세션 상태를 구독합니다.
    stopPolling = watchSessionState(subunitId, onSessionUpdate);
  }

  function onSessionUpdate(state) {
    if (state.status === '종료') {
      mode = null;
      showView('ended');
      if (stopPolling) stopPolling();
      return;
    }

    if (state.status === '일괄') {
      if (mode !== 'batch') {
        mode = 'batch';
        batchIndex = 0;
        renderBatchQuestion();
      }
      return;
    }

    if (state.status !== '진행중' || !state.currentQuestionId || !questionsById[state.currentQuestionId]) {
      mode = null;
      showView('waiting');
      return;
    }

    if (mode !== 'single' || state.currentQuestionId !== currentQuestionId) {
      mode = 'single';
      currentQuestionId = state.currentQuestionId;
      renderQuestion(questionsById[currentQuestionId]);
    }
  }

  // 선생님이 문항을 하나씩 진행하는 모드
  function renderQuestion(q) {
    showView('quiz');
    els.progressText.textContent = '';
    els.singleModeHint.style.display = 'block';
    renderChoices(q);
  }

  // 학생이 소단원 전체 문항을 자기 속도로 풀어나가는 모드
  function renderBatchQuestion() {
    showView('quiz');
    els.singleModeHint.style.display = 'none';
    if (batchIndex >= questionsList.length) {
      els.progressText.textContent = '';
      els.attemptBanner.style.display = 'none';
      els.conceptTag.textContent = '';
      els.questionText.textContent = '';
      els.choiceList.innerHTML = '<p class="muted">이 소단원 문항을 모두 풀었어요! 수고했어요.</p>';
      return;
    }
    els.progressText.textContent = `${batchIndex + 1} / ${questionsList.length}`;
    renderChoices(questionsList[batchIndex]);
  }

  function renderChoices(q) {
    selectedChoice = null;
    selectedConfidence = null;

    els.conceptTag.textContent = q.coreConcept || '';
    els.questionText.textContent = q.question;

    const priorAttempts = attemptCounts[q.questionId] || 0;
    if (priorAttempts > 0) {
      els.attemptBanner.style.display = 'block';
      els.attemptBanner.textContent = `지금은 ${priorAttempts + 1}번째 풀고 있어요.`;
    } else {
      els.attemptBanner.style.display = 'none';
    }

    els.choiceList.innerHTML = '';

    q.choices.forEach((choiceText, idx) => {
      const num = idx + 1;
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.type = 'button';
      btn.dataset.choiceNum = String(num);
      btn.textContent = `${num}. ${choiceText}`;
      btn.addEventListener('click', () => onChoiceSelected(q, num, btn));
      els.choiceList.appendChild(btn);
    });
  }

  function choiceButtons() {
    return [...els.choiceList.querySelectorAll('button.choice')];
  }

  let followupEl = null; // 선택한 보기 바로 아래에 끼워넣는 확신도 블록

  function onChoiceSelected(q, num, btnEl) {
    selectedChoice = num;
    choiceButtons().forEach((c) => {
      c.classList.remove('selected', 'correct', 'incorrect');
      c.disabled = false;
    });
    btnEl.classList.add('selected');

    if (followupEl) followupEl.remove();
    followupEl = document.createElement('div');
    followupEl.className = 'followup-block';

    const heading = document.createElement('h2');
    heading.textContent = '이 답에 대해 얼마나 확신하나요?';
    heading.style.marginTop = '4px';
    followupEl.appendChild(heading);

    const confidenceList = document.createElement('div');
    confidenceList.className = 'choice-list';
    CONFIDENCE_TAGS.forEach((tag) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.type = 'button';
      btn.textContent = tag.label;
      btn.addEventListener('click', () => onConfidenceSelected(q, tag));
      confidenceList.appendChild(btn);
    });
    followupEl.appendChild(confidenceList);

    btnEl.insertAdjacentElement('afterend', followupEl);
    followupEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 확신도 선택 -> 정오답 공개 + 피드백을 팝업으로 표시. "확인"을 누르면
  // 배치 모드는 다음 문항으로 자동 진행, 단일(선생님 진행) 모드는 팝업만 닫힘.
  function onConfidenceSelected(q, tag) {
    selectedConfidence = tag;

    const isCorrect = selectedChoice === q.answer;
    latestResultByQuestion[q.questionId] = isCorrect;

    choiceButtons().forEach((c) => {
      const num = Number(c.dataset.choiceNum);
      c.disabled = true;
      if (num === q.answer) c.classList.add('correct');
      else if (num === selectedChoice) c.classList.add('incorrect');
    });
    if (followupEl) followupEl.remove();

    const feedbackKey = feedbackKeyFor(isCorrect, tag.bucket);
    const chatbotUrl = !isCorrect && q.coreConcept ? buildChatbotUrl(q) : null;
    const chatbotLabel =
      tag.bucket === 'confident'
        ? '확신했는데 틀렸어요 — 관련 내용 답하기로 다시 짚어보기'
        : '관련 내용 답하기로 이 개념 다시 살펴보기';

    showFeedbackModal(isCorrect, q.feedback[feedbackKey] || '', chatbotUrl, chatbotLabel, () => {
      if (mode === 'batch') {
        batchIndex += 1;
        renderBatchQuestion();
      }
      // 단일(선생님 진행) 모드는 팝업만 닫고, 선생님이 다음 문항으로 넘길 때까지 대기.
    });

    callApi('submitFormativeResponse', {
      subunitId: subunitId,
      questionId: q.questionId,
      selectedChoice: selectedChoice,
      confidence: tag.label,
      isCorrect: isCorrect,
      coreConcept: q.coreConcept || '',
    })
      .then((result) => {
        attemptCounts[q.questionId] = result.attemptNumber;
      })
      .catch((err) => console.warn('응답 저장 실패:', err.message));
  }

  function buildChatbotUrl(q) {
    const chatUrl = new URL('../chatbot/index.html', window.location.href);
    chatUrl.searchParams.set('concept', q.coreConcept);
    chatUrl.searchParams.set('from', 'formative');
    chatUrl.searchParams.set('subunit', subunitId);
    chatUrl.searchParams.set('question', q.questionId);
    return chatUrl.toString();
  }

  function showFeedbackModal(isCorrect, feedbackText, chatbotUrl, chatbotLabel, onConfirm) {
    els.modalBox.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    box.textContent = feedbackText;
    els.modalBox.appendChild(box);

    if (chatbotUrl) {
      const link = document.createElement('a');
      link.className = 'btn block';
      link.style.marginTop = '12px';
      link.style.textDecoration = 'none';
      link.textContent = chatbotLabel;
      link.href = chatbotUrl;
      els.modalBox.appendChild(link);
    }

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn secondary block';
    confirmBtn.style.marginTop = '12px';
    confirmBtn.textContent = '확인';
    confirmBtn.addEventListener('click', () => {
      els.modalOverlay.style.display = 'none';
      onConfirm();
    });
    els.modalBox.appendChild(confirmBtn);

    els.modalOverlay.style.display = 'flex';
  }

  if (user) init();
</script>
</body>
</html>
