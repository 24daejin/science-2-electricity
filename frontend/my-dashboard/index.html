<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 대시보드 · 전기와 자기 학습 플랫폼</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
</head>
<body>
<div class="page">
  <a href="../index.html" class="btn secondary" style="margin-bottom:14px; text-decoration:none; display:inline-flex;">← 홈으로</a>
  <div class="brand">
    <div class="badge"></div>
    <div>
      <h1>내 대시보드</h1>
      <p class="muted" id="subtitle"></p>
    </div>
  </div>

  <div id="error-view" class="card error" style="display:none;"></div>

  <div id="view" class="card" style="display:none;">
    <div style="margin-bottom:16px;">
      <span class="tag">교과서 활동 점수 <strong id="score-activity">0</strong>점</span>
      <span class="tag" id="score-diagnostic" style="display:none;"></span>
    </div>

    <div id="diagnostic-section" style="display:none; margin-bottom:24px;">
      <h2>진단평가 결과</h2>
      <p class="muted" id="diagnostic-summary"></p>
      <div id="weak-concepts"></div>
    </div>

    <h2>"관련 내용 답하기" 평가</h2>
    <p class="muted">선생님이 확인한 대화만 여기 나타나요.</p>
    <div id="evaluations"></div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const user = requireLogin();

  const els = {
    error: document.getElementById('error-view'),
    view: document.getElementById('view'),
    subtitle: document.getElementById('subtitle'),
    scoreActivity: document.getElementById('score-activity'),
    scoreDiagnostic: document.getElementById('score-diagnostic'),
    diagnosticSection: document.getElementById('diagnostic-section'),
    diagnosticSummary: document.getElementById('diagnostic-summary'),
    weakConcepts: document.getElementById('weak-concepts'),
    evaluations: document.getElementById('evaluations'),
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showError(msg) {
    els.error.style.display = 'block';
    els.error.textContent = msg;
  }

  function starString(n) {
    const stars = Math.max(0, Math.min(5, Number(n) || 0));
    return '★'.repeat(stars) + '☆'.repeat(5 - stars);
  }

  function fmtTime(t) {
    if (!t) return '';
    const d = new Date(t);
    return isNaN(d) ? String(t) : d.toLocaleString('ko-KR');
  }

  function renderEvaluations(evaluations) {
    if (!evaluations.length) {
      els.evaluations.innerHTML = '<p class="muted">아직 확인된 평가가 없어요.</p>';
      return;
    }
    els.evaluations.innerHTML = evaluations
      .map(
        (e) => `
      <div class="status-banner" style="margin-bottom:10px;">
        <strong>${escapeHtml(e.concept || '')}</strong>${e.standard ? ` (${escapeHtml(e.standard)})` : ''}<br>
        <span style="font-size:1.2rem; letter-spacing:2px;">${starString(e.stars)}</span> ${e.stars}/5점<br>
        <span class="muted">${escapeHtml(e.rationale || '')}</span>
        <p class="muted" style="margin:4px 0 0; font-size:0.82rem;">${fmtTime(e.time)}</p>
      </div>`
      )
      .join('');
  }

  function renderDiagnostic(answered, correct, weakConcepts) {
    if (!answered) {
      els.diagnosticSection.style.display = 'none';
      els.scoreDiagnostic.style.display = 'none';
      return;
    }

    els.scoreDiagnostic.style.display = 'inline-block';
    els.scoreDiagnostic.textContent = `진단평가 ${correct}/${answered}개 정답`;

    els.diagnosticSection.style.display = 'block';
    els.diagnosticSummary.textContent = `${answered}문제 중 ${correct}개를 맞혔어요.`;

    if (!weakConcepts.length) {
      els.weakConcepts.innerHTML = '<p class="muted">틀린 문제 없이 다 맞혔어요! 👏</p>';
      return;
    }

    els.weakConcepts.innerHTML =
      '<p class="muted" style="margin-bottom:10px;">아래 개념은 다시 한번 살펴보면 좋아요.</p>' +
      weakConcepts
        .map((w) => {
          const chatLink = `../chatbot/index.html?concept=${encodeURIComponent(w.concept)}`;
          return `
      <div class="weak-concept-card">
        <h3>${escapeHtml(w.concept)}</h3>
        ${w.question ? `<p class="question-text">Q. ${escapeHtml(w.question)}</p>` : ''}
        <p class="explanation">${escapeHtml(w.explanation || '설명이 등록되어 있지 않아요.')}</p>
        <a class="btn secondary" style="margin-top:10px; text-decoration:none; display:inline-flex;" href="${chatLink}">"관련 내용 답하기"로 더 물어보기</a>
      </div>`;
        })
        .join('');
  }

  async function load() {
    try {
      const result = await callApi('getMyDashboard', {});
      els.subtitle.textContent = `${result.student.classroom}반 ${result.student.number}번 ${result.student.name}님`;
      els.scoreActivity.textContent = result.activityScore;
      renderDiagnostic(result.diagnosticAnswered || 0, result.diagnosticCorrect || 0, result.weakConcepts || []);
      renderEvaluations(result.chatbotEvaluations || []);
      els.view.style.display = 'block';
    } catch (err) {
      showError('대시보드를 불러오지 못했습니다: ' + err.message);
    }
  }

  if (user) {
    if (user.role !== 'student') {
      showError('학생 계정으로 로그인해야 볼 수 있는 화면입니다.');
    } else {
      load();
    }
  }
</script>
</body>
</html>
