<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학생명단 관리 · 전기와 자기 학습 플랫폼</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="badge"></div>
    <div>
      <h1>학생명단 · 반코드 관리</h1>
      <p class="muted">학기 중 전학·반 편성 변경과 반별 로그인 코드를 이 화면에서 바로 반영할 수 있어요.</p>
    </div>
  </div>

  <div id="error-view" class="card error" style="display:none;"></div>

  <div class="card">
    <h2>반별 로그인 코드</h2>
    <p class="muted">학생은 학번+이름+이 코드로 로그인합니다. 코드를 바꾸면 즉시 반영되니, 수업 시작 시 칠판에 적어 안내하세요.</p>
    <div id="class-code-list"></div>
    <div class="form-grid" style="margin-top:12px;">
      <input id="cc-classroom" placeholder="반 (예: 3)" />
      <input id="cc-code" placeholder="새 코드 (예: 4자리 숫자)" />
    </div>
    <button class="btn" id="cc-save-btn">반코드 저장</button>
  </div>

  <div class="card">
    <h2 id="form-title">학생 추가</h2>
    <div class="form-grid">
      <input id="f-studentId" placeholder="학번 (예: 20301)" />
      <input id="f-name" placeholder="이름" />
      <input id="f-classroom" placeholder="반 (예: 3)" />
      <select id="f-status">
        <option value="활성">활성</option>
        <option value="비활성">비활성</option>
      </select>
      <input id="f-note" placeholder="비고 (선택)" />
      <input id="f-email" placeholder="이메일 (선택, 기록용 — 로그인에는 쓰이지 않음)" />
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="save-btn">저장</button>
      <button class="btn secondary" id="cancel-edit-btn" style="display:none;">수정 취소</button>
    </div>
  </div>

  <div class="card">
    <h2>전체 명단 (<span id="roster-count">0</span>명)</h2>
    <div style="overflow-x:auto;">
      <table class="roster-table">
        <thead>
          <tr><th>학번</th><th>이름</th><th>반</th><th>상태</th><th>비고</th><th></th></tr>
        </thead>
        <tbody id="roster-tbody"></tbody>
      </table>
    </div>
  </div>

  <a class="btn secondary block" href="../index.html" style="margin-top:8px; text-decoration:none;">홈으로 돌아가기</a>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const user = requireTeacher();

  let roster = [];
  let classCodes = [];

  const els = {
    error: document.getElementById('error-view'),
    tbody: document.getElementById('roster-tbody'),
    count: document.getElementById('roster-count'),
    formTitle: document.getElementById('form-title'),
    studentId: document.getElementById('f-studentId'),
    name: document.getElementById('f-name'),
    classroom: document.getElementById('f-classroom'),
    email: document.getElementById('f-email'),
    status: document.getElementById('f-status'),
    note: document.getElementById('f-note'),
    saveBtn: document.getElementById('save-btn'),
    cancelEditBtn: document.getElementById('cancel-edit-btn'),
    classCodeList: document.getElementById('class-code-list'),
    ccClassroom: document.getElementById('cc-classroom'),
    ccCode: document.getElementById('cc-code'),
    ccSaveBtn: document.getElementById('cc-save-btn'),
  };

  function showError(msg) {
    els.error.style.display = 'block';
    els.error.textContent = msg;
  }

  function clearForm() {
    els.studentId.value = '';
    els.studentId.disabled = false;
    els.name.value = '';
    els.classroom.value = '';
    els.email.value = '';
    els.status.value = '활성';
    els.note.value = '';
    els.formTitle.textContent = '학생 추가';
    els.cancelEditBtn.style.display = 'none';
  }

  function startEdit(student) {
    els.studentId.value = student.studentId;
    els.studentId.disabled = true; // 학번은 식별자이므로 수정 중에는 잠금
    els.name.value = student.name || '';
    els.classroom.value = student.classroom || '';
    els.email.value = student.email || '';
    els.status.value = student.status || '활성';
    els.note.value = student.note || '';
    els.formTitle.textContent = `${student.name || student.studentId} 정보 수정`;
    els.cancelEditBtn.style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderRoster() {
    els.count.textContent = roster.length;
    els.tbody.innerHTML = roster
      .map(
        (s) => `
      <tr>
        <td>${s.studentId}</td>
        <td>${s.name || ''}</td>
        <td>${s.classroom || ''}</td>
        <td>${s.status || ''}</td>
        <td>${s.note || ''}</td>
        <td style="white-space:nowrap;">
          <button class="btn secondary" data-edit="${s.studentId}" style="padding:6px 12px; font-size:0.85rem;">수정</button>
          <button class="btn secondary" data-delete="${s.studentId}" style="padding:6px 12px; font-size:0.85rem; color:#e03131; border-color:#e03131;">삭제</button>
        </td>
      </tr>`
      )
      .join('');

    els.tbody.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const s = roster.find((r) => String(r.studentId) === btn.dataset.edit);
        if (s) startEdit(s);
      });
    });
    els.tbody.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => onDelete(btn.dataset.delete));
    });
  }

  function renderClassCodes() {
    if (!classCodes.length) {
      els.classCodeList.innerHTML = '<p class="muted">아직 설정된 반코드가 없습니다. 아래에서 추가하세요.</p>';
      return;
    }
    els.classCodeList.innerHTML = classCodes
      .map((c) => `<div class="status-banner">${c.classroom}반 → <strong>${c.code}</strong></div>`)
      .join('');
  }

  async function loadRoster() {
    try {
      roster = await callApi('listRoster', {});
      renderRoster();
    } catch (err) {
      showError('명단을 불러오지 못했습니다: ' + err.message);
    }
  }

  async function loadClassCodes() {
    try {
      classCodes = await callApi('listClassCodes', {});
      renderClassCodes();
    } catch (err) {
      showError('반코드를 불러오지 못했습니다: ' + err.message);
    }
  }

  async function onSave() {
    const studentId = els.studentId.value.trim();
    const name = els.name.value.trim();
    const classroom = els.classroom.value.trim();
    if (!studentId || !name || !classroom) {
      alert('학번, 이름, 반은 필수입니다(로그인 시 그대로 사용됩니다).');
      return;
    }

    els.saveBtn.disabled = true;
    try {
      await callApi('upsertRosterEntry', {
        studentId,
        name,
        classroom,
        email: els.email.value.trim(),
        status: els.status.value,
        note: els.note.value.trim(),
      });
      clearForm();
      await loadRoster();
    } catch (err) {
      alert('저장에 실패했습니다: ' + err.message);
    } finally {
      els.saveBtn.disabled = false;
    }
  }

  async function onDelete(studentId) {
    if (!confirm(`학번 ${studentId} 학생을 명단에서 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
    try {
      await callApi('deleteRosterEntry', { studentId });
      await loadRoster();
    } catch (err) {
      alert('삭제에 실패했습니다: ' + err.message);
    }
  }

  async function onSaveClassCode() {
    const classroom = els.ccClassroom.value.trim();
    const code = els.ccCode.value.trim();
    if (!classroom || !code) {
      alert('반과 코드를 모두 입력해주세요.');
      return;
    }
    els.ccSaveBtn.disabled = true;
    try {
      await callApi('setClassCode', { classroom, code });
      els.ccClassroom.value = '';
      els.ccCode.value = '';
      await loadClassCodes();
    } catch (err) {
      alert('반코드 저장에 실패했습니다: ' + err.message);
    } finally {
      els.ccSaveBtn.disabled = false;
    }
  }

  els.saveBtn.addEventListener('click', onSave);
  els.cancelEditBtn.addEventListener('click', clearForm);
  els.ccSaveBtn.addEventListener('click', onSaveClassCode);

  if (user) {
    loadRoster();
    loadClassCodes();
  }
</script>
</body>
</html>
